services:
  db:
    image: postgres:17-alpine
    ports:
      - "54329:5432"
    environment:
      POSTGRES_USER: rowan
      POSTGRES_PASSWORD: rowan
      POSTGRES_DB: rowan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rowan -d rowan"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
